# 模型目录（录题插件财产，2026-11-18 配置归插件卡）：加条目/改说明只动本文件，不改底座代码。
# 本文件随插件 zip 发行、随插件更新覆盖（清单可更新）；老师的勾选住 model_prefs.toml（carried 保住）。
# 每条必填：id / name / capability（layout=切题、recognize=转写、both=两边、formula=公式专科裁图）/ summary / summary_usage / rule。
# rule＝三态规则名（底座通用契约解释器只认这七个，未知规则＝blocked＋提示更新底座）：
#   import_probe：probe=模块名，import 探到＝ready、探不到＝degraded；
#   weight_present：store=权重档，model_store 在＝ready、不在＝degraded＋degraded_action；
#   task_assign：task=AI 中心任务键，指派在＝ready、不在＝degraded＋degraded_action；
#   mineru_local：隔离环境体检三态（install 动作照旧）；
#   vlm_local：本地 VLM 隔离环境体检＋显存门组合（T6；install_vlm 动作）；
#   vram_gate：min_vram＋硬件探针，低于门槛直写不支持引导云；够格也只登记待接线；
#   blocked：detail 全由本文件给。
# 人话模板占位符由底座填：{name}/{model}（指派）、{version}/{message}（体检）、
# {vram_label}/{min_vram}/{fits}（硬件）。缺占位符值时原样念模板，不静默。
# plan_layout/plan_recognize＝选中本条时底座公共管道要走的步骤键（瀑布实现名归底座）；
# aliases_layout/aliases_recognize＝老插件旧引擎名兼容映射；
# route_note_layout/route_note_recognize＝批次路由里「只走谁」的人话计划说明。
# min_vram＝本地运行最低显存（G，0＝不吃显卡）；can_cpu＝能否纯 CPU 跑。
# family：vlm＝本地视觉大模型（硬件门；Qwen 座 T6 已接推理，其余座待接线）；formula＝公式专科（安装/推理/擂台同在 D 卡）。
# gate_note：条目已就绪但调度尚未接线时，闸口回 auto 并照念这句（接线后删掉本行即放行）。
# [auto] 段＝自动分流默认座（T6）：纯图卷走 image_seat 整题直转；文字卷文字直取正文＋公式裁图送 text_formula_seat。
# 老师在模型配置「自动分流默认」区可改（prefs 键 auto_image_seat/auto_text_formula_seat，选「自动」＝沿用本段）。
# 默认哪条由 D 擂台实测后改本段即上架；默认座未就绪＝显性失败引导，绝不静默换座。

vram_note = "int4 显存为估算、标「约」，以实测加载为准；4G 档不开，低于 6G 仍可安装但只能 CPU 慢兜底，或改云端视觉/MinerU。"

[auto]
image_seat = "mineru_local"
text_formula_seat = "formula_pp_m"

